services:
  - type: web
    name: aabtrading-backend
    runtime: python
    plan: starter
    autoDeploy: true
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --access-logfile - --error-logfile - --capture-output --log-level info
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_DB_TARGET
        value: supa
      # Uploaded images go to a Supabase Storage bucket. Without these the API falls
      # back to its own disk, which this platform wipes on every deploy.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_UPLOADS_BUCKET
        value: uploads
      - key: JWT_SECRET
        sync: false
      - key: OTP_GMAIL_USER
        sync: false
      - key: OTP_GMAIL_APP_PASSWORD
        sync: false
      - key: OTP_FROM_NAME
        value: Ann Ann's Beverages Trading
      - key: OTP_FROM_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GMAIL_API_REFRESH_TOKEN
        sync: false
      - key: GMAIL_API_SENDER_EMAIL
        sync: false

  - type: web
    name: aabtrading-frontend
    runtime: node
    plan: starter
    autoDeploy: true
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx next start -p $PORT -H 0.0.0.0
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_APP_VARIANT
        value: all
      - key: DJANGO_API_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: OTP_GMAIL_USER
        sync: false
      - key: OTP_GMAIL_APP_PASSWORD
        sync: false
      - key: OTP_FROM_NAME
        value: Ann Ann's Beverages Trading
